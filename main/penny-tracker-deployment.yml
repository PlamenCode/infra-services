apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penny-tracker-data
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penny-tracker
  namespace: services
  labels:
    app: penny-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penny-tracker
  template:
    metadata:
      labels:
        app: penny-tracker
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: penny-tracker
          image: plamencode/penny-tracker:3
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: expense-tracker-auth
          env:
            - name: SHARED_AUTH_COOKIE_DOMAIN
              value: .devopsplamen.work
            - name: SHARED_AUTH_COOKIE_NAME
              value: devops_private_auth
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: DB_PATH
              value: /data/expense-tracker.db
            - name: TZ
              value: Europe/Sofia
          volumeMounts:
            - name: penny-tracker-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: penny-tracker-data
          persistentVolumeClaim:
            claimName: penny-tracker-data

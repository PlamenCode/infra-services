apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracker-data
  namespace: services
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: services
  labels:
    app: tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: tracker
          # Publish this tag successfully before syncing (build run 2 failed Docker Hub login).
          image: plamencode/tracker:3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: expense-tracker-auth
          env:
            - name: AUTH_COOKIE_NAME
              value: tracker_private_session
            - name: SHARED_AUTH_COOKIE_DOMAIN
              value: .devopsplamen.work
            - name: SHARED_AUTH_COOKIE_NAME
              value: devops_private_auth
            - name: AUTH_SECURE_COOKIES
              value: "true"
            - name: LOCAL_DEMO_AUTH
              value: "false"
            - name: AUTH_STATE_PATH
              value: /data/auth.json
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /data/car.db
            - name: TZ
              value: Europe/Sofia
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracker-data

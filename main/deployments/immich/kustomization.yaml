apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
resources:
  - server.yaml
  - dependencies.yaml
  - storage.yaml
  - storagebox.yaml
  - ingress.yaml
configMapGenerator:
  - name: immich-bootstrap
    files:
      - bootstrap.mjs
  - name: immich-config
    files:
      - immich.json

apiVersion: apps/v1
kind: Deployment
metadata:
  name: piwigo-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piwigo-db
  template:
    metadata:
      labels:
        app: piwigo-db
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: mariadb
          image: mariadb:11.4
          args:
            - --innodb-buffer-pool-size=64M
            - --max-connections=20
            - --performance-schema=OFF
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - { name: MARIADB_DATABASE, value: piwigo }
            - { name: MARIADB_USER, value: piwigo }
            - { name: MARIADB_RANDOM_ROOT_PASSWORD, value: '1' }
            - { name: TZ, value: Europe/Sofia }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: piwigo-prod
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: piwigo-db
---
apiVersion: v1
kind: Service
metadata:
  name: piwigo-db
spec:
  selector:
    app: piwigo-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

apiVersion: v1
kind: PersistentVolume
metadata:
  name: piwigo-storagebox
spec:
  capacity:
    storage: 900Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    namespace: services
    name: piwigo-gallery
  mountOptions:
    - iocharset=utf8
    - vers=3.1.1
    - seal
    - dir_mode=0770
    - file_mode=0660
    - uid=1000
    - gid=1000
    - noperm
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: 'u713495-sub1.your-storagebox.de#piwigo#u713495-sub1'
    volumeAttributes:
      source: '//u713495-sub1.your-storagebox.de/u713495-sub1'
      # Must exist before the first Pod mounts this static volume.
      subDir: piwigo
    nodeStageSecretRef:
      name: piwigo-storagebox
      namespace: services
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-gallery
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ''
  volumeName: piwigo-storagebox
  resources:
    requests:
      storage: 900Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-db
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deck-of-pain
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - deckofpain.devopsplamen.work
      secretName: devopsplamen-work-tls
  rules:
    - host: deckofpain.devopsplamen.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deck-of-pain
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: deck-of-pain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deck-of-pain
  template:
    metadata:
      labels:
        app: deck-of-pain
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: deck-of-pain
          image: plamencode/deck-of-pain-workout:1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PUBLIC_ORIGIN
              value: https://deckofpain.devopsplamen.work
            - name: DB_PATH
              value: /data/workouts.db
            - name: DB_MAX_BYTES
              value: "9000000000"
            - name: TZ
              value: Europe/Sofia
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deck-of-pain-data

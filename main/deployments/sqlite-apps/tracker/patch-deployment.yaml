# Deployment name
- op: replace
  path: /metadata/name
  value: tracker

# Deployment labels
- op: add
  path: /metadata/labels
  value:
    app: tracker

# Deployment strategy
- op: add
  path: /spec/strategy
  value:
    type: Recreate

# Deployment selector
- op: replace
  path: /spec/selector/matchLabels/app
  value: tracker

# Pod labels
- op: replace
  path: /spec/template/metadata/labels/app
  value: tracker

# Disable service account token mounting
- op: add
  path: /spec/template/spec/automountServiceAccountToken
  value: false

# Pod security context
- op: add
  path: /spec/template/spec/securityContext
  value:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true

# Container name
- op: replace
  path: /spec/template/spec/containers/0/name
  value: tracker

# Authentication Secret
- op: add
  path: /spec/template/spec/containers/0/envFrom
  value:
    - secretRef:
        name: expense-tracker-auth

# Authentication cookie name
- op: add
  path: /spec/template/spec/containers/0/env/0
  value:
    name: AUTH_COOKIE_NAME
    value: tracker_private_session

# Shared authentication cookie domain
- op: add
  path: /spec/template/spec/containers/0/env/1
  value:
    name: SHARED_AUTH_COOKIE_DOMAIN
    value: .devopsplamen.work

# Shared authentication cookie name
- op: add
  path: /spec/template/spec/containers/0/env/2
  value:
    name: SHARED_AUTH_COOKIE_NAME
    value: devops_private_auth

# Secure authentication cookies
- op: add
  path: /spec/template/spec/containers/0/env/3
  value:
    name: AUTH_SECURE_COOKIES
    value: "true"

# Disable local demo authentication
- op: add
  path: /spec/template/spec/containers/0/env/4
  value:
    name: LOCAL_DEMO_AUTH
    value: "false"

# Authentication state file
- op: add
  path: /spec/template/spec/containers/0/env/5
  value:
    name: AUTH_STATE_PATH
    value: /data/auth.json

# SQLite database path
- op: add
  path: /spec/template/spec/containers/0/env/9
  value:
    name: DB_PATH
    value: /data/car.db

# Readiness probe
- op: add
  path: /spec/template/spec/containers/0/readinessProbe
  value:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5

# Liveness probe
- op: add
  path: /spec/template/spec/containers/0/livenessProbe
  value:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 15

# CPU and memory resources
- op: add
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Container security context
- op: add
  path: /spec/template/spec/containers/0/securityContext
  value:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# PVC reference
- op: replace
  path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
  value: tracker-data
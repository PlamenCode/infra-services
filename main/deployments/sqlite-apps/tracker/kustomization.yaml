apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared SQLite application base
resources:
  - ../../../base/sqlite-app
  - pvc.yaml

namespace: services

# Docker image
images:
  - name: example.invalid/template
    newName: plamencode/tracker
    newTag: "8"

patches:
  # Deployment
  - target:
      kind: Deployment
      name: app-template
    path: patch-deployment.yaml
    options:
      allowNameChange: true

  # Service
  - target:
      kind: Service
      name: app-template
    path: patch-service.yaml
    options:
      allowNameChange: true
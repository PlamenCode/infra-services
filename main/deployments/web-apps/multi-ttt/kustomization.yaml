apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared web application base
resources:
  - ../../../base/web-app

namespace: services

# Docker image
images:
  - name: example.invalid/template
    newName: plamencode/multi-ttt
    newTag: "3"

patches:
  # Deployment
  - target:
      kind: Deployment
      name: app-template
    path: patch-deployment.yaml
    options:
      allowNameChange: true

  # Service
  - target:
      kind: Service
      name: app-template
    path: patch-service.yaml
    options:
      allowNameChange: true
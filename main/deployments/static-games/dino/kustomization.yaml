apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the shared static web base
resources:
  - ../../../base/static-web

# Keep the existing namespace
namespace: services

# Dino Docker image
images:
  - name: example.invalid/template
    newName: plamencode/dino-game
    newTag: "3"

# Customize the Deployment
patches:
  - target:
      kind: Deployment
      name: app-template
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: dino

      - op: replace
        path: /spec/selector/matchLabels/app
        value: dino

      - op: replace
        path: /spec/template/metadata/labels/app
        value: dino

      - op: replace
        path: /spec/template/spec/containers/0/name
        value: dino

  # Customize the Service
  - target:
      kind: Service
      name: app-template
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: dino

      - op: replace
        path: /spec/selector/app
        value: dino
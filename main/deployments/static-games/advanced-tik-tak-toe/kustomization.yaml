apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared base
resources:
  - ../../../base/static-web

namespace: services

# Docker image
images:
  - name: example.invalid/template
    newName: plamencode/three-piece-tik-tak-toe
    newTag: "2"

patches:
  # Deployment
  - target:
      kind: Deployment
      name: app-template
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: advanced-tik-tak-toe

      - op: add
        path: /metadata/labels
        value:
          app: advanced-tik-tak-toe

      - op: replace
        path: /spec/selector/matchLabels/app
        value: advanced-tik-tak-toe

      - op: replace
        path: /spec/template/metadata/labels/app
        value: advanced-tik-tak-toe

      - op: replace
        path: /spec/template/spec/containers/0/name
        value: advanced-tik-tak-toe

      # Named HTTP port
      - op: add
        path: /spec/template/spec/containers/0/ports/0/name
        value: http

      # CPU and memory resources
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

  # Service
  - target:
      kind: Service
      name: app-template
    options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: advanced-tik-tak-toe

      - op: add
        path: /metadata/labels
        value:
          app: advanced-tik-tak-toe

      - op: replace
        path: /spec/selector/app
        value: advanced-tik-tak-toe

      - op: add
        path: /spec/ports/0/name
        value: http

      - op: remove
        path: /spec/ports/0/protocol